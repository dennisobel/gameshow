# Netlify serves only the static web app. It cannot proxy a WebSocket, so a Netlify
# deployment must point the app at the public API (see WEB_API_URL in .env.example).
#
# This is a monorepo: the site's package is apps/web, an npm workspace, so the
# dependencies install from the repository's root lockfile.
[build]
  base    = "apps/web"
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Single-page app: serve index.html for any path so deep links and refreshes work.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Vite fingerprints everything in /assets, so it's safe to cache forever.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
