# A browser asking to upgrade (a game socket) is passed through as an upgrade;
# anything else is an ordinary request.
# The scheme the visitor used. A proxy in front of this one that ends the TLS (a
# Cloudflare tunnel, a load balancer) says so in X-Forwarded-Proto; with none, it is
# this connection's own scheme. The API uses it to decide whether a cookie may be Secure.
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen       80;

    # Who is really calling. A client can send any X-Forwarded-For it likes, so it
    # is never trusted: nginx rebuilds it from the connection itself. Behind a
    # Cloudflare tunnel the connection comes from this host, so Cloudflare's own
    # header is believed, but only when it arrives from a private address.
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header   CF-Connecting-IP;

    server_name  _;
    root         /usr/share/nginx/html;
    index        index.html;

    # Serving the app and the API from one origin removes CORS entirely and
    # lets the refresh cookie be HttpOnly and SameSite=Lax (ARCHITECTURE §8).
    location /v1/ {
        proxy_pass         http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header   Host              $http_host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $remote_addr;
        proxy_set_header   X-Forwarded-Proto $forwarded_proto;
        proxy_read_timeout 60s;
    }

    # The live game: one long-lived WebSocket per player. Host keeps its port so
    # the API's same-origin check on the upgrade passes, and the timeouts allow a
    # whole match (and a long pause) without the proxy hanging up on a quiet line.
    location ~ ^/v1/rooms/[^/]+/ws$ {
        proxy_pass         http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        $connection_upgrade;
        proxy_set_header   Host              $http_host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $remote_addr;
        proxy_set_header   X-Forwarded-Proto $forwarded_proto;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering    off;
    }

    location ~ ^/(healthz|readyz)$ {
        proxy_pass       http://api:8080$request_uri;
        proxy_set_header Host $http_host;
    }

    # Fingerprinted assets never change under the same name.
    location /assets/ {
        expires    1y;
        add_header Cache-Control "public, immutable";
    }

    # Single-page app: /g/ABC123, /r/K7QM and every other route must serve
    # index.html, or a shared link would 404 on refresh.
    location / {
        try_files $uri $uri/ /index.html;
    }

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip             on;
    gzip_types       text/css application/javascript application/json image/svg+xml;
    gzip_min_length  1024;
}
