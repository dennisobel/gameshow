# Local development conveniences, layered on top of docker-compose.yml:
#
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d
#
# (`make up` and the other make targets do this for you.)
#
# It publishes each service's own port so tools on THIS computer can reach them
# (psql, curl against the API, the AI service's /docs). Every binding is to
# 127.0.0.1, so nothing here is reachable from another machine.
#
# It is never used on a server. The base file publishes only the web app, which is
# what makes it safe to start next to other projects: there is nothing here to
# collide with, and no database listening on the internet.
services:
  postgres:
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-15432}:5432"
  qdrant:
    ports:
      - "127.0.0.1:${QDRANT_PORT:-16333}:6333"
      - "127.0.0.1:${QDRANT_GRPC_PORT:-16334}:6334"
  api:
    ports:
      - "127.0.0.1:${API_PORT:-8090}:8080"
  ai:
    ports:
      - "127.0.0.1:${AI_PORT:-8000}:8000"
